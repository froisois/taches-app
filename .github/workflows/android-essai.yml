name: Appli Android d'essai

on:
  push:
    paths: ['android-essai/**', '.github/workflows/android-essai.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilation
        run: gradle -p android-essai assembleDebug --no-daemon
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-essai/app/build/outputs/apk/debug/app-debug.apk taches-essai.apk
          gh release delete essai-android --yes --cleanup-tag || true
          gh release create essai-android taches-essai.apk \
            --title "Appli Android d'essai" \
            --notes "Essai d'écriture dans OneDrive. Fichier compilé automatiquement à partir de android-essai/ (commit ${GITHUB_SHA::7})." \
            --target "$GITHUB_SHA"
