plugins { id 'com.android.application' }

// Signature : clé fixe fournie par les secrets GitHub (KEYSTORE_FILE, KEYSTORE_PASS) pour que chaque
// nouvelle version s'installe par-dessus la précédente. Sans eux, clé de débogage temporaire.
def cle = System.getenv('KEYSTORE_FILE')

android {
    namespace 'fr.froisois.taches'
    compileSdk 34
    defaultConfig {
        applicationId 'fr.froisois.taches'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName '1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    signingConfigs {
        if (cle) {
            fixe {
                storeFile file(cle)
                storeType 'pkcs12'
                enableV1Signing true
                enableV2Signing true
                storePassword System.getenv('KEYSTORE_PASS')
                keyAlias 'taches'
                keyPassword System.getenv('KEYSTORE_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig cle ? signingConfigs.fixe : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
